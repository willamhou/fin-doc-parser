[project]
name = "fin-doc-parser"
version = "0.1.0"
description = "AI-powered financial document parsing SDK. Extract structured data from financial statements, bank statements, invoices, and more."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "willamhou" }]
keywords = ["finance", "ocr", "llm", "document-parsing", "financial-statement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
]
pdf = [
    "pymupdf>=1.24",
]
ocr = [
    "paddleocr>=2.7",
    "paddlepaddle>=2.6",
]
all = [
    "fin-doc-parser[excel,pdf,ocr]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/willamhou/fin-doc-parser"
Repository = "https://github.com/willamhou/fin-doc-parser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findocparser"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
